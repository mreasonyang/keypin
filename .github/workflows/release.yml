name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing exact stable tag matching Info.plist, for example v0.0.14'
        required: true
        type: string

permissions:
  contents: read

# Every release shares one lock, including releases of different tags.
concurrency:
  group: keypin-production-release
  cancel-in-progress: false

jobs:
  sign-and-notarize:
    if: github.repository == 'mreasonyang/keypin'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      KEYPIN_ARCH: universal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact tag and required signing configuration
        id: source
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          python3 scripts/release-preflight.py "$RELEASE_TAG" --check-git --check-credentials
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run all checks before signing
        run: |
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          bash scripts/ci.sh
      - name: Sign, notarize, staple, assess and sign update feed
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: bash scripts/release.sh --tag "$RELEASE_TAG"
      - name: Always remove temporary keychain and credential files
        if: always()
        run: bash scripts/cleanup-release.sh
      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KeyPin-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release/KeyPin-*-universal.zip
            build/release/KeyPin-*-universal.dmg
            build/release/appcast.xml
            build/release/SHA256SUMS
            build/release/verification.json
          if-no-files-found: error
          retention-days: 14

  stage:
    needs: sign-and-notarize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.sign-and-notarize.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.sign-and-notarize.outputs.commit }}
    steps:
      - name: Download verified release files from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: KeyPin-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Stage exact tag for installation acceptance without overwriting a release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          remote_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$remote_commit" == "$RELEASE_COMMIT" ]] || { echo 'Tag moved after signing; refusing publication' >&2; exit 1; }
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/keypin-releases.json"
          previous_tag="$(python3 - "$RUNNER_TEMP/keypin-releases.json" <<'PY'
          import json,os,re,sys,xml.etree.ElementTree as ET
          version = tuple(map(int, os.environ['RELEASE_TAG'][1:].split('.')))
          previous = []
          for release in json.load(open(sys.argv[1])):
              if not release['isDraft'] and not release['isPrerelease'] and re.fullmatch(r'v\d+\.\d+\.\d+', release['tagName']):
                  old_version = tuple(map(int,release['tagName'][1:].split('.')))
                  assert old_version < version, 'Release must be newer than all published stable versions'
                  previous.append((old_version, release['tagName']))
          if previous: print(max(previous)[1])
          PY
          )"
          if [[ -n "$previous_tag" ]]; then
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir "$RUNNER_TEMP/keypin-previous"
            python3 - "$RUNNER_TEMP/keypin-previous/appcast.xml" appcast.xml <<'PY'
          import sys,xml.etree.ElementTree as ET
          ns = '{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          def builds(path):
              return [int(item.findtext(ns + 'version')) for item in ET.parse(path).findall('./channel/item')]
          old, new = builds(sys.argv[1]), builds(sys.argv[2])
          assert old and len(new) == 1 and new[0] > max(old), 'CFBundleVersion must increase beyond the previous stable release'
          PY
          fi
          gh release create "$RELEASE_TAG" "KeyPin-${RELEASE_TAG#v}-universal.zip" "KeyPin-${RELEASE_TAG#v}-universal.dmg" appcast.xml SHA256SUMS verification.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "KeyPin ${RELEASE_TAG#v}" --generate-notes
          # A failed upload/verification stays draft. Re-running never overwrites it:
          # inspect and delete that failed draft before retrying the exact tag.
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/keypin-uploaded"
          (cd "$RUNNER_TEMP/keypin-uploaded" && sha256sum --check SHA256SUMS)
          cmp SHA256SUMS "$RUNNER_TEMP/keypin-uploaded/SHA256SUMS"
          echo 'PASS: draft assets verified; publish this exact draft after installation acceptance'
