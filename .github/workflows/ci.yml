name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Test and build development package
        env:
          KEYPIN_CI_ARCHIVE: '1'
        run: bash scripts/ci.sh
      - name: Upload development package (ad-hoc signed, not notarized)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KeyPin-development-${{ github.sha }}
          path: build/development/*
          if-no-files-found: error
          retention-days: 14
