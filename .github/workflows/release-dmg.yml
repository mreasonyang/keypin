name: Add notarized DMG to an existing release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to wrap without rebuilding
        required: true
        type: string
      revision:
        description: Installer revision (adds rN without replacing existing assets)
        required: true
        default: '2'
        type: string

permissions:
  contents: read

concurrency:
  group: keypin-production-release
  cancel-in-progress: false

jobs:
  dmg:
    if: github.repository == 'mreasonyang/keypin' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Finder layout tools
        run: python3 -m pip install --require-hashes -r packaging/dmg/requirements.txt
      - name: Download and verify the exact published ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          INSTALLER_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', os.environ['RELEASE_TAG'])
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['INSTALLER_REVISION']) and int(os.environ['INSTALLER_REVISION']) >= 2
          PY
          mkdir -p build/source build/release
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > build/source/release.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "KeyPin-${RELEASE_TAG#v}-universal.zip" --dir build/source
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads(Path('build/source/release.json').read_text())
          assert not release['draft'] and not release['prerelease']
          name = f"KeyPin-{os.environ['RELEASE_TAG'][1:]}-universal.zip"
          installer = f"KeyPin-{os.environ['RELEASE_TAG'][1:]}-universal-r{os.environ['INSTALLER_REVISION']}.dmg"
          assert not any(a['name'] == installer for a in release['assets']), 'Installer revision already exists; never overwrite assets'
          asset, = [a for a in release['assets'] if a['name'] == name]
          data = (Path('build/source') / name).read_bytes()
          assert asset['digest'] == 'sha256:' + hashlib.sha256(data).hexdigest()
          assert len(data) == asset['size']
          print('PASS: published ZIP digest and size match GitHub metadata')
          PY
      - name: Package, sign, notarize and verify DMG
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          INSTALLER_REVISION: ${{ inputs.revision }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: bash scripts/release-dmg.sh "$RELEASE_TAG" "$PWD/build/source/KeyPin-${RELEASE_TAG#v}-universal.zip" "$PWD/build/release/KeyPin-${RELEASE_TAG#v}-universal-r${INSTALLER_REVISION}.dmg"
      - name: Always remove signing credentials
        if: always()
        run: bash scripts/cleanup-release.sh
      - name: Publish verified installer revision and recheck uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          INSTALLER_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          cd build/release
          installer="KeyPin-${RELEASE_TAG#v}-universal-r${INSTALLER_REVISION}.dmg"
          shasum -a 256 --check "$installer.sha256"
          gh release upload "$RELEASE_TAG" "$installer" "$installer.sha256" --repo "$GITHUB_REPOSITORY"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$installer*" --dir downloaded
          (cd downloaded && shasum -a 256 --check "$installer.sha256")
